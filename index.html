    <script type="application/ld+json">

          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",

            "url": "%VITE_SITE_URL%/",

            "publisher": { "@id": "%VITE_SITE_URL%/#organization" }

          {
            "@type": "Organization",
            "@id": "%VITE_SITE_URL%/#organization",
            "name": "KreatifyLabs",
            "url": "%VITE_SITE_URL%/",
            "logo": "%VITE_SITE_URL%/brand/kreatifylabs-logo.png",
